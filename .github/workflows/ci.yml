name: ci
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, python: '3.12'}
          - {os: ubuntu-latest, python: '3.12'}
          - {os: ubuntu-latest, python: '3.9', fast: '1'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '${{ matrix.python }}'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: 22}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: {go-version: stable}
      - name: Scanners
        run: |
          pipx install semgrep
          if [ "$RUNNER_OS" = macOS ]; then brew install gitleaks osv-scanner; else
            curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | sudo tar xz -C /usr/local/bin gitleaks
            sudo curl -sSL -o /usr/local/bin/osv-scanner https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
            sudo chmod +x /usr/local/bin/osv-scanner
          fi
      - run: pip install -e .
      - run: bugscan doctor || true
      - run: python -m unittest discover -s tests -t . -v
        env:
          BUGSCAN_TEST_FAST: ${{ matrix.fast }}
      - name: Keep the scan logs when tests fail
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scan-logs-${{ matrix.os }}-${{ matrix.python }}
          path: ~/.cache/bugscan-test/projects/**/*.log
          if-no-files-found: ignore
